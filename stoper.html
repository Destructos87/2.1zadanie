<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stoper</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", sans-serif;
      background: #edf2ef;
      color: #17241f;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background-image: linear-gradient(135deg, #edf2ef 0%, #dce8e1 100%);
    }

    main {
      width: min(100%, 440px);
      padding: 40px 32px 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #d5e0d9;
      border-radius: 12px;
      box-shadow: 0 18px 50px #20372b18;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 1rem;
      font-weight: 650;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #547064;
    }

    #display {
      margin: 0 0 32px;
      font-variant-numeric: tabular-nums;
      font-size: clamp(3rem, 14vw, 4.5rem);
      font-weight: 600;
      line-height: 1;
      color: #17241f;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    button {
      min-width: 132px;
      min-height: 48px;
      padding: 10px 20px;
      border: 1px solid transparent;
      border-radius: 6px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, transform 140ms ease;
    }

    button:hover { transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #81b69b; outline-offset: 3px; }

    #toggle {
      color: #fff;
      background: #26734f;
    }

    #toggle:hover { background: #1d5e40; }

    #reset {
      color: #34443c;
      background: #e8eee9;
      border-color: #d6e0d9;
    }

    #reset:hover { background: #dce6df; }

    @media (max-width: 380px) {
      main { padding: 32px 20px 24px; }
      .controls { flex-direction: column; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Stoper</h1>
    <p id="display" role="timer" aria-label="Czas stopera">00:00.00</p>
    <div class="controls">
      <button id="toggle" type="button">Start</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    const toggleButton = document.querySelector("#toggle");
    const resetButton = document.querySelector("#reset");

    let elapsed = 0;
    let startedAt = 0;
    let animationFrame = null;

    function formatTime(milliseconds) {
      const centiseconds = Math.floor(milliseconds / 10);
      const minutes = Math.floor(centiseconds / 6000);
      const seconds = Math.floor((centiseconds % 6000) / 100);
      const fraction = centiseconds % 100;

      return [minutes, seconds].map(value => String(value).padStart(2, "0")).join(":")
        + "." + String(fraction).padStart(2, "0");
    }

    function updateDisplay() {
      display.textContent = formatTime(elapsed + performance.now() - startedAt);
      animationFrame = requestAnimationFrame(updateDisplay);
    }

    function start() {
      startedAt = performance.now();
      toggleButton.textContent = "Pauza";
      animationFrame = requestAnimationFrame(updateDisplay);
    }

    toggleButton.addEventListener("click", () => {
      if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
        elapsed += performance.now() - startedAt;
        display.textContent = formatTime(elapsed);
        toggleButton.textContent = "Wznów";
      } else {
        start();
      }
    });

    resetButton.addEventListener("click", () => {
      if (animationFrame !== null) cancelAnimationFrame(animationFrame);
      animationFrame = null;
      elapsed = 0;
      startedAt = 0;
      display.textContent = formatTime(0);
      toggleButton.textContent = "Start";
    });
  </script>
</body>
</html>
